<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THLS — Test Señal</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:monospace; background:#07090f; color:#fff;
         display:flex; flex-direction:column; align-items:center;
         padding:20px 16px; gap:12px; min-height:100vh; }

  /* ── CÍRCULO CON PULSO ─────────────────────────── */
  @keyframes sigPulse {
    0%,100% { box-shadow: 0 0 0px  0px currentColor; }
    50%      { box-shadow: 0 0 32px 12px currentColor; }
  }
  #circle { width:160px; height:160px; border-radius:50%; display:flex;
            flex-direction:column; align-items:center; justify-content:center;
            border:3px solid #333; transition:background .4s,border-color .4s,color .4s;
            flex-shrink:0;
            animation: sigPulse 3s ease-in-out infinite; }
  #circle.dead  { animation: none; }

  #rssi   { font-size:36px; font-weight:bold; }
  #dist   { font-size:12px; opacity:.7; margin-top:2px; }
  #state  { font-size:18px; font-weight:bold; letter-spacing:2px; text-align:center; }
  #status { font-size:11px; color:#555; text-align:center; max-width:280px; }
  input   { background:#111; border:1px solid #333; color:#fff; padding:8px 12px;
            border-radius:6px; font-family:monospace; font-size:14px; width:200px;
            text-align:center; }
  button  { background:#00b4d8; color:#000; border:none; border-radius:6px;
            padding:14px 0; font-family:monospace; font-weight:bold;
            font-size:16px; cursor:pointer; width:200px; letter-spacing:1px; }
</style>
</head>
<body>

<div id="circle">
  <div id="rssi">—</div>
  <div id="dist">sin datos</div>
</div>

<div id="state">SIN CONEXIÓN</div>
<div id="status">Ingresa la IP del ESP32 y presiona START</div>

<input id="ip" value="" placeholder="192.168.4.1">
<button onclick="toggle()">▶ START</button>

<script>
// Auto-detecta host: usa el servidor actual si no es 192.168.4.1 hardcodeado
document.getElementById('ip').value = window.location.host || '192.168.4.1';

// Velocidad de parpadeo por estado: más rápido = más cerca
const COLORS = [
  { min:-999, max:-94, bg:'#1a1a2e', label:'SIN SEÑAL',         pulse:0    },
  { min:-94,  max:-84, bg:'#0d47a1', label:'POLAR',             pulse:4    },
  { min:-84,  max:-75, bg:'#1976d2', label:'FRÍO',              pulse:3    },
  { min:-75,  max:-67, bg:'#00838f', label:'FRESCO',            pulse:2.5  },
  { min:-67,  max:-60, bg:'#7b1fa2', label:'TIBIO',             pulse:2    },
  { min:-60,  max:-53, bg:'#c2185b', label:'CALIENTE',          pulse:1.2  },
  { min:-53,  max:-47, bg:'#e64a19', label:'MUY CALIENTE',      pulse:0.7  },
  { min:-47,  max:-41, bg:'#ff6f00', label:'ARDIENDO',          pulse:0.35 },
  { min:-41,  max:  0, bg:'#00c853', label:'BALIZA LOCALIZADA', pulse:0.15 },
];

let timer = null;

function getState(r) { return COLORS.find(c => r >= c.min && r < c.max) || COLORS[0]; }
function getDist(r, txp=-59) {
  const d = Math.pow(10, (txp-r)/25);
  return d<1?'< 1 m':d>500?'> 500 m':d.toFixed(0)+' m';
}

function applyPulse(s) {
  const circ = document.getElementById('circle');
  if (!s.pulse) {
    // Sin señal: sin animación
    circ.classList.add('dead');
    circ.style.animationDuration = '';
    circ.style.color = '#333';
  } else {
    circ.classList.remove('dead');
    circ.style.animationDuration = s.pulse + 's';
    circ.style.color = s.bg;   // box-shadow usa currentColor
  }
}

async function poll() {
  const ip = document.getElementById('ip').value.trim();
  try {
    const r = await fetch('http://'+ip+'/api/status', { signal:AbortSignal.timeout(2000) });
    const d = await r.json();
    const rssi = d.rssi ?? -100;
    const s = getState(rssi);
    document.getElementById('rssi').textContent  = rssi+' dBm';
    document.getElementById('dist').textContent  = '≈ '+getDist(rssi, d.txPower??-59);
    document.getElementById('state').textContent = s.label + (d.challenge ? '  ⚠' : '');
    document.getElementById('circle').style.background  = s.bg+'33';
    document.getElementById('circle').style.borderColor = s.bg;
    document.getElementById('status').textContent = 'OK · '+new Date().toLocaleTimeString()
      +(d.challenge?' · CHALLENGE ACTIVO':'');
    applyPulse(s);
  } catch(e) {
    document.getElementById('rssi').textContent  = '✗';
    document.getElementById('dist').textContent  = e.name==='TimeoutError'?'timeout':e.message.slice(0,25);
    document.getElementById('state').textContent = 'SIN RESPUESTA';
    document.getElementById('circle').style.background  = '#1a0000aa';
    document.getElementById('circle').style.borderColor = '#c00';
    document.getElementById('status').textContent = '¿WiFi THLS-C001 conectado? ¿ESP32 encendido?';
    applyPulse(COLORS[0]); // sin pulso en error
  }
}

function toggle() {
  const btn = document.querySelector('button');
  if (timer) {
    clearInterval(timer); timer=null;
    btn.textContent='▶ START'; btn.style.background='#00b4d8';
  } else {
    btn.textContent='■ STOP'; btn.style.background='#e53935';
    poll();
    timer = setInterval(poll, 1000);
  }
}
</script>
</body>
</html>
